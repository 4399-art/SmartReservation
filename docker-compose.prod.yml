services:
  mysql:
    image: mysql:8.0
    container_name: smart-reservation-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smart2026}
      MYSQL_DATABASE: lab_agent
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psmart2026"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - smart-reservation-net

  backend:
    image: smart-reservation-backend:latest
    container_name: smart-reservation-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_chroma:/app/chroma_db
      - backend_rag:/app/rag_uploads
      - ./backend/.env:/app/.env:ro
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - smart-reservation-net

  frontend:
    image: smart-reservation-frontend:latest
    container_name: smart-reservation-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - smart-reservation-net

volumes:
  mysql_data:
    name: smart-reservation-mysql
  backend_uploads:
    name: smart-reservation-uploads
  backend_chroma:
    name: smart-reservation-chroma
  backend_rag:
    name: smart-reservation-rag

networks:
  smart-reservation-net:
    driver: bridge
    name: smart-reservation-net